<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheduler Diagrams</title>
<style>
  :root { --bg:#ffffff; --panel:#f5f6f8; --text:#1f2328; --muted:#656d76; --accent:#0969da; --border:#d0d7de; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1f22; --panel:#2b2d30; --text:#dfe1e5; --muted:#8c8f94; --accent:#548af7; --border:#393b40; }
  }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  nav { width:280px; flex-shrink:0; overflow:auto; background:var(--panel); border-right:1px solid var(--border); padding:12px 0; }
  nav h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 16px 6px; }
  nav a { display:block; padding:5px 16px; color:var(--text); text-decoration:none; font-family:ui-monospace, monospace; font-size:12.5px; }
  nav a:hover { background:var(--border); }
  nav a.active { color:var(--accent); font-weight:600; border-left:3px solid var(--accent); padding-left:13px; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--border); }
  header strong { flex:1; font-family:ui-monospace, monospace; }
  header span { color:var(--muted); font-size:12px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  #stage { flex:1; overflow:hidden; cursor:grab; }
  #stage:active { cursor:grabbing; }
  #stage svg { width:100%; height:100%; max-width:none !important; }
  #error { color:#cf222e; white-space:pre-wrap; padding:16px; font-family:ui-monospace, monospace; }
  @media (max-width: 700px) { body { flex-direction:column; } nav { width:100%; max-height:35vh; } }
</style>
</head>

<nav id="nav"></nav>
<main>

    <strong id="title"></strong>
    <span>scroll = zoom · drag = pan</span>
    <button id="zoomIn">+</button>
    <button id="zoomOut">−</button>
    <button id="fit">Fit</button>
  </header>
  <div id="stage"></div>
</main>
<script id="data" type="application/json">[{"id": "roadmap/d1-outbox-invalidation", "group": "Roadmap", "name": "d1-outbox-invalidation", "src": "sequenceDiagram\n    participant API\n    participant PG as PostgreSQL\n    participant W as Outbox Relay\n    participant R as Redis\n    API->>PG: BEGIN\n    API->>PG: INSERT appointment (exclusion constraint)\n    API->>PG: INSERT outbox_events (AppointmentBooked)\n    API->>PG: COMMIT (both or neither)\n    PG-->>W: NOTIFY outbox (wake-up) / polling fallback\n    W->>PG: SELECT \u2026 FOR UPDATE SKIP LOCKED\n    W->>R: INCR avail:ver:{dealershipId}:{date}\n    W->>PG: mark processed\n"}, {"id": "roadmap/roadmap-overview", "group": "Roadmap", "name": "roadmap-overview", "src": "flowchart TD\n    START([Scenario A: Unified Service Scheduler]) --> P1\n\n    subgraph P1[\"Phase 1 \u2014 Discovery & System Design\"]\n        P1a[Requirements \u2192 acceptance criteria]\n        P1b[Assumptions list]\n        P1c[Domain model]\n        P1d[Architecture diagram]\n        P1e[Data flow \u2014 TBD]\n        P1f[Tech choices \u2014 TBD]\n    end\n\n    subgraph P2[\"Phase 2 \u2014 Scaffolding\"]\n        P2a[Project setup]\n        P2b[PostgreSQL + exclusion constraints<br/>Redis read cache]\n        P2c[CI pipeline]\n    end\n\n    subgraph P3[\"Phase 3 \u2014 Core Features\"]\n        R1[R1: Resource-constrained booking]\n        R2[R2: Real-time availability check<br/>ServiceBay + qualified Technician]\n        R3[R3: Confirmed appointment record]\n        R1 --> R2 --> R3\n    end\n\n    subgraph P4[\"Phase 4 \u2014 Testing\"]\n        P4a[Unit tests]\n        P4b[Integration tests]\n        P4c[Concurrency / edge cases]\n    end\n\n    subgraph P5[\"Phase 5 \u2014 Build for the Future\"]\n        P5a[Logging]\n        P5b[Metrics]\n        P5c[Tracing]\n        P5d[Scalability / reliability notes]\n    end\n\n    subgraph P6[\"Phase 6 \u2014 Docs & Client Stub\"]\n        P6a[OpenAPI / cURL examples]\n        P6b[README + AI Collaboration Narrative]\n        P6c[System Design Document final]\n    end\n\n    subgraph P7[\"Phase 7 \u2014 Submission\"]\n        P7a[Video 5\u201310 min]\n        P7b[Final checklist & submit]\n    end\n\n    P1 --> P2 --> P3 --> P4 --> P5 --> P6 --> P7\n\n    AI[[AI collaboration log<br/>runs across all phases]] -.-> P1\n    AI -.-> P3\n    AI -.-> P4\n    AI -.-> P6\n"}, {"id": "hld/01-system-context", "group": "High-Level Design", "name": "01-system-context", "src": "flowchart LR\n    CUS([\"Customer\"])\n    ADV([\"Service Advisor\"])\n    CLIENT[\"Client<br/>(stubbed: Swagger UI / cURL / .http)\"]\n    SCHED[\"Unified Service Scheduler\"]\n    OBS[\"Jaeger (tracing)\"]\n\n    CUS -->|\"check availability, book, cancel\"| CLIENT\n    ADV -->|\"view dealership schedule\"| CLIENT\n    CLIENT -->|\"REST / JSON\"| SCHED\n    SCHED -->|\"traces\"| OBS\n"}, {"id": "hld/02-container", "group": "High-Level Design", "name": "02-container", "src": "flowchart TB\n    CLIENT[\"Client<br/>(Swagger UI / cURL)\"]\n\n    subgraph APP[\"Application\"]\n        LB[\"Load Balancer\"]\n        API1[\"Scheduler API<br/>instance 1\"]\n        API2[\"Scheduler API<br/>instance N\"]\n        RELAY[\"Outbox Relay<br/>(background worker)\"]\n    end\n\n    subgraph DATA[\"Data\"]\n        PG[(\"PostgreSQL<br/>source of truth<br/>tstzrange + exclusion constraints<br/>outbox_events\")]\n        REDIS[(\"Redis<br/>availability cache<br/>version keys<br/>rate limit buckets\")]\n    end\n\n    subgraph OBS[\"Observability\"]\n        JAEGER[\"Jaeger<br/>(OTLP traces)\"]\n    end\n\n    CLIENT --> LB\n    LB --> API1\n    LB --> API2\n\n    API1 -->|\"read / write (transactions)\"| PG\n    API2 -->|\"read / write (transactions)\"| PG\n    API1 -->|\"cache-aside reads, rate limit\"| REDIS\n    API2 -->|\"cache-aside reads, rate limit\"| REDIS\n\n    PG -.->|\"NOTIFY outbox\"| RELAY\n    RELAY -->|\"poll SKIP LOCKED, mark processed\"| PG\n    RELAY -->|\"INCR version key\"| REDIS\n\n    API1 -.->|\"OTLP traces\"| JAEGER\n    API2 -.->|\"OTLP traces\"| JAEGER\n    RELAY -.->|\"OTLP traces\"| JAEGER\n"}, {"id": "hld/03-1-flow-check-availability", "group": "High-Level Design", "name": "03-1-flow-check-availability", "src": "flowchart LR\n    A[\"GET /availability\"] --> B{\"Rate limit OK?\"}\n    B -- \"no\" --> X[\"429 Too Many Requests\"]\n    B -- \"yes\" --> C{\"Redis cache hit?\"}\n    C -- \"yes\" --> D[\"Return cached slots\"]\n    C -- \"no / Redis down\" --> E[\"Compute from PostgreSQL\"]\n    E --> F[\"Store in Redis (TTL)\"]\n    F --> D\n"}, {"id": "hld/03-2-flow-book-appointment", "group": "High-Level Design", "name": "03-2-flow-book-appointment", "src": "flowchart LR\n    A[\"POST /appointments\"] --> B[\"Validate request\"]\n    B --> C[\"Find free bay + qualified technician\"]\n    C --> D[\"One transaction:<br/>INSERT appointment<br/>INSERT outbox event\"]\n    D -- \"commit OK\" --> E[\"201 Created\"]\n    D -- \"exclusion violation\" --> F{\"Other candidate?\"}\n    F -- \"yes\" --> D\n    F -- \"no\" --> G[\"409 Conflict\"]\n"}, {"id": "hld/03-3-flow-cache-invalidation", "group": "High-Level Design", "name": "03-3-flow-cache-invalidation", "src": "flowchart LR\n    A[\"Committed outbox event\"] --> B[\"Outbox Relay\"]\n    B --> C[\"INCR avail:ver:dealer:date\"]\n    C --> D[\"Old cache entries ignored,<br/>expire via TTL\"]\n    B --> E[\"Mark event processed\"]\n"}, {"id": "hld/04-design-principles", "group": "High-Level Design", "name": "04-design-principles", "src": "mindmap\n  root((Scheduler))\n    Correctness\n      PostgreSQL is the single source of truth\n      Exclusion constraints block overlaps\n      Half-open intervals\n    Performance\n      Redis cache-aside for availability\n      Version-key invalidation\n      Indexes on resource + time\n    Reliability\n      Transactional outbox\n      Fail-open when Redis is down\n      Idempotent invalidation\n    Scalability\n      Stateless API instances\n      SKIP LOCKED relay workers\n    Observability\n      Structured logs\n      Traces (Jaeger)\n"}, {"id": "dld/01-component", "group": "Detail-Level Design", "name": "01-component", "src": "flowchart TB\n    CLIENT([\"Client\"])\n\n    subgraph WEB[\"Web layer\"]\n        direction LR\n        RL[\"RateLimitFilter\"]\n        AC[\"AppointmentController\"]\n        AVC[\"AvailabilityController\"]\n        LC[\"LookupController\"]\n        EH[\"GlobalExceptionHandler<br/>(RFC 7807)\"]\n    end\n\n    subgraph DOMAIN[\"Domain layer\"]\n        direction LR\n        BS[\"BookingService\"]\n        VAL[\"BookingValidator\"]\n        RS[\"ResourceSelector\"]\n        AVS[\"AvailabilityService<br/>(per vehicle-type pool)\"]\n        OBW[\"OutboxWriter\"]\n    end\n\n    subgraph CACHE[\"Cache layer\"]\n        direction LR\n        AC_CACHE[\"AvailabilityCache\"]\n        SF[\"SingleFlightLock\"]\n    end\n\n    subgraph PERSIST[\"Persistence layer\"]\n        direction LR\n        WRITE_REPO[\"AppointmentRepository<br/>OutboxRepository\"]\n        READ_REPO[\"Dealership \u00b7 ServiceType \u00b7 Vehicle<br/>Technician \u00b7 ServiceBay<br/>Repositories\"]\n    end\n\n    subgraph WORKER[\"Background workers\"]\n        direction LR\n        RELAY[\"OutboxRelay\"]\n        CLEAN[\"OutboxCleanupJob\"]\n    end\n\n    REDIS[(\"Redis\")]\n    PG[(\"PostgreSQL\")]\n\n    CLIENT --> RL\n    RL --> AC & AVC & LC\n    AC --> BS\n    AVC --> AVS\n    LC --> READ_REPO\n\n    BS --> VAL & RS & AVS & OBW\n    BS --> WRITE_REPO\n    OBW --> WRITE_REPO\n    AVS --> AC_CACHE\n    AVS --> READ_REPO\n    AC_CACHE --> SF\n\n    PERSIST --> PG\n    CACHE -.-> REDIS\n    RL -.-> REDIS\n\n    RELAY --> WRITE_REPO\n    CLEAN --> WRITE_REPO\n    RELAY -.->|\"INCR version key\"| REDIS\n"}, {"id": "dld/02-constraints", "group": "Detail-Level Design", "name": "02-constraints", "src": "flowchart LR\n    APPT[\"appointment\"]\n    APPT --> C1[\"EXCLUDE USING gist<br/>(technician_id WITH =,<br/>tstzrange(start_time, end_time, '[)') WITH &&)<br/>WHERE status <> 'CANCELLED'\"]\n    APPT --> C2[\"EXCLUDE USING gist<br/>(service_bay_id WITH =,<br/>tstzrange(start_time, end_time, '[)') WITH &&)<br/>WHERE status <> 'CANCELLED'\"]\n    APPT --> C3[\"EXCLUDE USING gist<br/>(vehicle_id WITH =,<br/>tstzrange(...) WITH &&)<br/>WHERE status <> 'CANCELLED'<br/>(assumption TBD)\"]\n    APPT --> C4[\"CHECK end_time > start_time\"]\n    APPT --> C5[\"FOREIGN KEY (service_bay_id, vehicle_type)<br/>REFERENCES service_bay(id, vehicle_type)<br/>(bay must be in the vehicle's pool)\"]\n    BAY[\"service_bay\"] --> U1[\"UNIQUE (id, vehicle_type)<br/>(target of C5)\"]\n    BAY --> I3[\"INDEX (dealership_id, vehicle_type) WHERE active\"]\n    APPT --> I1[\"INDEX (dealership_id, start_time)\"]\n    OUT[\"outbox_events\"] --> I2[\"PARTIAL INDEX (id)<br/>WHERE processed_at IS NULL\"]\n"}, {"id": "dld/02-erd", "group": "Detail-Level Design", "name": "02-erd", "src": "erDiagram\n    DEALERSHIP ||--o{ SERVICE_BAY : has\n    DEALERSHIP ||--o{ TECHNICIAN : employs\n    DEALERSHIP ||--o{ APPOINTMENT : hosts\n    TECHNICIAN ||--o{ TECHNICIAN_SKILL : has\n    SERVICE_TYPE ||--o{ TECHNICIAN_SKILL : \"requires\"\n    TECHNICIAN ||--o{ TECHNICIAN_VEHICLE_TYPE : \"certified for\"\n    CUSTOMER ||--o{ VEHICLE : owns\n    CUSTOMER ||--o{ APPOINTMENT : books\n    VEHICLE ||--o{ APPOINTMENT : \"serviced in\"\n    SERVICE_TYPE ||--o{ APPOINTMENT : \"type of\"\n    TECHNICIAN ||--o{ APPOINTMENT : \"assigned to\"\n    SERVICE_BAY ||--o{ APPOINTMENT : \"occupied by\"\n\n    DEALERSHIP {\n        uuid id PK\n        string name\n        string timezone \"e.g. Asia/Ho_Chi_Minh\"\n        time open_time\n        time close_time\n    }\n    SERVICE_BAY {\n        uuid id PK\n        uuid dealership_id FK\n        string name\n        string vehicle_type \"PRIVATE_CAR | TRUCK | EV (pool)\"\n        boolean active\n    }\n    TECHNICIAN {\n        uuid id PK\n        uuid dealership_id FK\n        string name\n        boolean active\n    }\n    SERVICE_TYPE {\n        uuid id PK\n        string code UK \"OIL_CHANGE\"\n        string name\n        int duration_minutes\n    }\n    TECHNICIAN_SKILL {\n        uuid technician_id PK, FK\n        uuid service_type_id PK, FK\n    }\n    TECHNICIAN_VEHICLE_TYPE {\n        uuid technician_id PK, FK\n        string vehicle_type PK \"PRIVATE_CAR | TRUCK | EV\"\n    }\n    CUSTOMER {\n        uuid id PK\n        string name\n        string email\n        string phone\n    }\n    VEHICLE {\n        uuid id PK\n        uuid customer_id FK\n        string vin UK\n        string make\n        string model\n        int year\n        string vehicle_type \"PRIVATE_CAR | TRUCK | EV\"\n    }\n    APPOINTMENT {\n        uuid id PK\n        uuid customer_id FK\n        uuid vehicle_id FK\n        uuid dealership_id FK\n        uuid service_type_id FK\n        uuid technician_id FK\n        uuid service_bay_id FK\n        string vehicle_type \"copied from vehicle, FK with bay\"\n        timestamptz start_time\n        timestamptz end_time\n        string status \"CONFIRMED | CANCELLED | COMPLETED\"\n        string idempotency_key UK \"nullable\"\n        timestamptz created_at\n        timestamptz updated_at\n    }\n    OUTBOX_EVENTS {\n        bigint id PK\n        string aggregate_type \"Appointment\"\n        uuid aggregate_id\n        string event_type \"AppointmentBooked ...\"\n        jsonb payload \"dealershipId, dates\"\n        timestamptz created_at\n        timestamptz processed_at \"nullable\"\n        int attempts\n    }\n"}, {"id": "dld/03-api-contract", "group": "Detail-Level Design", "name": "03-api-contract", "src": "flowchart LR\n    subgraph V1[\"/api/v1\"]\n        E1[\"POST /appointments<br/>201 | 400 | 404 | 409 | 429\"]\n        E2[\"GET /appointments/{id}<br/>200 | 404\"]\n        E3[\"GET /appointments?dealershipId=&date=<br/>200\"]\n        E4[\"PATCH /appointments/{id}/cancel<br/>200 | 404 | 409\"]\n        E5[\"PATCH /appointments/{id}/reschedule<br/>200 | 404 | 409\"]\n        E6[\"GET /availability?dealershipId=&serviceTypeId=&vehicleType=&from=&to=<br/>200 | 400 | 429\"]\n        E7[\"GET /dealerships, /service-types, /vehicles/{vin}<br/>200 | 404\"]\n    end\n"}, {"id": "dld/04-seq-check-availability", "group": "Detail-Level Design", "name": "04-seq-check-availability", "src": "sequenceDiagram\n    autonumber\n    participant C as Client\n    participant RL as RateLimitFilter\n    participant AVS as AvailabilityService\n    participant CA as AvailabilityCache\n    participant R as Redis\n    participant PG as PostgreSQL\n\n    C->>RL: GET /availability (dealer, serviceType, vehicleType, from, to)\n    RL->>R: token bucket check\n    alt limit exceeded\n        RL-->>C: 429 Too Many Requests\n    else allowed\n        RL->>AVS: getAvailability()\n        AVS->>AVS: validate range (max 14 days)\n        loop each date in range\n            AVS->>CA: get(dealer, serviceType, vehicleType, date)\n            CA->>R: GET avail:ver:dealer:date\n            Note over CA,R: version is read BEFORE querying PostgreSQL\n            CA->>R: GET avail:dealer:date:v{ver}:serviceType:vehicleType\n            alt cache hit\n                R-->>CA: slots\n            else cache miss\n                CA->>R: SET lock NX PX (single-flight)\n                CA->>PG: load bays of pool, qualified technicians, active appointments, business hours\n                PG-->>CA: rows\n                CA->>CA: compute free slots\n                CA->>R: SET key slots EX ttl+jitter\n            else Redis unavailable\n                CA->>PG: compute directly (fail-open)\n            end\n            CA-->>AVS: slots for date\n        end\n        AVS-->>C: 200 OK (slots)\n    end\n"}, {"id": "dld/05-seq-book-appointment", "group": "Detail-Level Design", "name": "05-seq-book-appointment", "src": "sequenceDiagram\n    autonumber\n    participant C as Client\n    participant AC as AppointmentController\n    participant BS as BookingService\n    participant V as BookingValidator\n    participant AVS as AvailabilityService\n    participant RS as ResourceSelector\n    participant PG as PostgreSQL\n\n    C->>AC: POST /appointments (Idempotency-Key)\n    AC->>BS: book(request)\n    BS->>PG: find appointment by idempotency_key\n    alt key already used\n        PG-->>BS: existing appointment\n        BS-->>C: 201 Created (same appointment)\n    else new request\n        BS->>V: validate(request)\n        alt invalid\n            V-->>C: 400 / 404 ProblemDetail\n        else valid\n            BS->>BS: end = start + serviceType.duration\n            BS->>BS: vehicleType = vehicle.vehicle_type\n            BS->>AVS: findCandidates(dealer, serviceType, vehicleType, start, end)\n            AVS->>PG: free qualified technicians + free bays of pool (no cache)\n            PG-->>AVS: candidates\n            AVS->>RS: order(candidates)\n            RS-->>BS: ordered (bay, technician) pairs\n            loop each pair, max N attempts\n                BS->>PG: BEGIN\n                BS->>PG: INSERT appointment (CONFIRMED)\n                alt exclusion violation (23P01)\n                    PG-->>BS: conflict\n                    BS->>PG: ROLLBACK\n                    Note over BS: try next pair\n                else inserted\n                    BS->>PG: INSERT outbox_events (AppointmentBooked)\n                    BS->>PG: COMMIT\n                    BS-->>C: 201 Created\n                end\n            end\n            BS-->>C: 409 Conflict (no resources available)\n        end\n    end\n"}, {"id": "dld/06-seq-cancel-reschedule", "group": "Detail-Level Design", "name": "06-seq-cancel-reschedule", "src": "sequenceDiagram\n    autonumber\n    participant C as Client\n    participant BS as BookingService\n    participant PG as PostgreSQL\n\n    alt cancel\n        C->>BS: PATCH /appointments/{id}/cancel\n        BS->>PG: BEGIN\n        BS->>PG: UPDATE status = CANCELLED WHERE status = CONFIRMED\n        BS->>PG: INSERT outbox_events (AppointmentCancelled, date)\n        BS->>PG: COMMIT\n        BS-->>C: 200 OK\n    else reschedule\n        C->>BS: PATCH /appointments/{id}/reschedule (newStart)\n        BS->>PG: BEGIN\n        BS->>PG: UPDATE start_time, end_time (same or new resources)\n        alt exclusion violation\n            BS->>PG: ROLLBACK\n            BS-->>C: 409 Conflict\n        else ok\n            BS->>PG: INSERT outbox_events (AppointmentRescheduled, oldDate, newDate)\n            BS->>PG: COMMIT\n            BS-->>C: 200 OK\n        end\n    end\n"}, {"id": "dld/07-seq-outbox-relay", "group": "Detail-Level Design", "name": "07-seq-outbox-relay", "src": "sequenceDiagram\n    autonumber\n    participant PG as PostgreSQL\n    participant W as OutboxRelay\n    participant R as Redis\n\n    PG-->>W: NOTIFY outbox (or polling tick)\n    loop while pending events exist\n        W->>PG: BEGIN\n        W->>PG: SELECT ... WHERE processed_at IS NULL ORDER BY id LIMIT 100 FOR UPDATE SKIP LOCKED\n        PG-->>W: batch\n        loop each event\n            W->>W: extract (dealershipId, affected dates)\n            W->>R: INCR avail:ver:dealer:date + EXPIRE\n            alt Redis error\n                W->>PG: attempts = attempts + 1\n                Note over W: retry later with backoff\n            else ok\n                W->>PG: processed_at = now()\n            end\n        end\n        W->>PG: COMMIT\n    end\n"}, {"id": "dld/08-availability-computation", "group": "Detail-Level Design", "name": "08-availability-computation", "src": "flowchart TD\n    S([\"Input: dealer, serviceType, vehicleType, date\"]) --> A[\"duration = serviceType.duration_minutes\"]\n    A --> B[\"Load business hours (dealer timezone \u2192 UTC)\"]\n    B --> C[\"Load active bays of dealer<br/>WHERE vehicle_type = vehicleType (pool)\"]\n    B --> D[\"Load active technicians with skill = serviceType<br/>AND certified for vehicleType\"]\n    C --> E[\"Load non-cancelled appointments overlapping the day<br/>for those bays / technicians\"]\n    D --> E\n    E --> F[\"Generate candidate start times<br/>(slot step TBD, e.g. 15 min)\"]\n    F --> G{\"For each start:<br/>window = [start, start + duration)\"}\n    G --> H{\"Window inside business hours?\"}\n    H -- \"no\" --> SKIP[\"Skip\"]\n    H -- \"yes\" --> I{\"Exists free bay<br/>AND free qualified technician<br/>for the whole window?\"}\n    I -- \"no\" --> SKIP\n    I -- \"yes\" --> OK[\"Add slot\"]\n    OK --> G\n    SKIP --> G\n    G -- \"done\" --> R([\"Return list of free slots\"])\n"}, {"id": "dld/09-state-appointment", "group": "Detail-Level Design", "name": "09-state-appointment", "src": "stateDiagram-v2\n    [*] --> CONFIRMED: book (201)\n    CONFIRMED --> CONFIRMED: reschedule\n    CONFIRMED --> CANCELLED: cancel\n    CONFIRMED --> COMPLETED: service done\n    CANCELLED --> [*]\n    COMPLETED --> [*]\n"}, {"id": "dld/09-state-outbox-event", "group": "Detail-Level Design", "name": "09-state-outbox-event", "src": "stateDiagram-v2\n    [*] --> PENDING: inserted in booking transaction\n    PENDING --> PROCESSED: version key bumped\n    PENDING --> PENDING: Redis error, attempts + 1\n    PROCESSED --> [*]: cleanup after 7 days\n"}, {"id": "dld/10-redis-keys", "group": "Detail-Level Design", "name": "10-redis-keys", "src": "flowchart LR\n    subgraph KEYS[\"Redis keys\"]\n        K1[\"avail:ver:{dealerId}:{date}<br/>INT \u00b7 bumped by relay \u00b7 TTL 2 days\"]\n        K2[\"avail:{dealerId}:{date}:v{ver}:{serviceTypeId}:{vehicleType}<br/>JSON slots \u00b7 TTL 30\u201360s + jitter\"]\n        K3[\"avail:lock:{dealerId}:{date}:{serviceTypeId}:{vehicleType}<br/>single-flight \u00b7 PX 2s\"]\n        K4[\"ratelimit:{clientId}<br/>token bucket\"]\n    end\n    K1 -->|\"selects current\"| K2\n    K3 -.->|\"guards rebuild of\"| K2\n"}, {"id": "dld/11-error-handling", "group": "Detail-Level Design", "name": "11-error-handling", "src": "flowchart LR\n    E1[\"Validation error\"] --> H1[\"400 Bad Request\"]\n    E2[\"Unknown dealer / vehicle / service type\"] --> H2[\"404 Not Found\"]\n    E3[\"Vehicle not owned by customer\"] --> H1\n    E4[\"No free bay + technician in the vehicle's pool\"] --> H3[\"409 Conflict\"]\n    E9[\"Dealership has no pool for vehicle type\"] --> H7[\"422 Unprocessable Entity\"]\n    E5[\"Exclusion violation after all retries\"] --> H3\n    E6[\"Rate limit exceeded\"] --> H4[\"429 Too Many Requests\"]\n    E7[\"Redis unavailable\"] --> H5[\"Fail-open: serve from PostgreSQL<br/>+ log + span event\"]\n    E8[\"PostgreSQL unavailable\"] --> H6[\"503 Service Unavailable\"]\n"}, {"id": "dld/12-observability", "group": "Detail-Level Design", "name": "12-observability", "src": "flowchart LR\n    subgraph API[\"Scheduler API / Outbox Relay\"]\n        LOG[\"JSON logs (stdout)<br/>traceId, dealerId, outcome<br/>(no PII)\"]\n        TRC[\"Traces<br/>HTTP, JDBC, Redis spans\"]\n    end\n\n    TRC -->|\"OTLP\"| JAE[\"Jaeger\"]\n    LOG --> OUT[\"docker logs / stdout\"]\n    LOG -.->|\"traceId correlates\"| JAE\n"}, {"id": "dld/13-deployment", "group": "Detail-Level Design", "name": "13-deployment", "src": "flowchart TB\n    CLIENT([\"client\"]) -->|\":8080\"| NGX\n    subgraph DC[\"docker-compose\"]\n        NGX[\"nginx:1.30-alpine<br/>load balancer, least_conn<br/>networks: edge, lb-net\"]\n        API[\"server-api \u00d7 N (default 2)<br/>image keyloop/server-api<br/>no host port<br/>networks: lb-net, data-net\"]\n        BATCH[\"scheduler-batch<br/>image keyloop/scheduler-batch<br/>Spring Batch + ShedLock<br/>actuator :8081\"]\n        PG[(\"postgres:18-alpine<br/>+ btree_gist<br/>schemas: public, batch<br/>:5432\")]\n        RD[(\"redis:8-alpine<br/>cache only, allkeys-lru<br/>:6379\")]\n        JAE[\"jaeger :16686<br/>(OTLP :4317 / :4318)<br/>later phase\"]\n    end\n    MIG[\"Flyway migrations<br/>(run on server-api startup)\"] --> PG\n    NGX -->|\"lb-net (internal)<br/>Docker DNS, resolve every 5 s\"| API\n    API --> PG\n    API --> RD\n    BATCH -->|\"outbox_events, batch.*, batch.shedlock\"| PG\n    BATCH --> RD\n    BATCH -.->|\"depends_on: healthy\"| API\n    API -.->|\"OTLP traces\"| JAE\n    BATCH -.->|\"OTLP traces\"| JAE\n"}]</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
<script>
  const diagrams = JSON.parse(document.getElementById('data').textContent);
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'loose' });

  const nav = document.getElementById('nav');
  let lastGroup = null;
  for (const d of diagrams) {
    if (d.group !== lastGroup) {
      nav.insertAdjacentHTML('beforeend', `<h2>${d.group}</h2>`);
      lastGroup = d.group;
    }
    const a = document.createElement('a');
    a.href = '#' + d.id; a.textContent = d.name; a.dataset.id = d.id;
    a.onclick = e => {
      e.preventDefault();
      try { history.replaceState(null, '', '#' + d.id); } catch (_) {}
      show(d.id);
    };
    nav.appendChild(a);
  }

  let panZoom = null, seq = 0;
  async function show(id) {
    const d = diagrams.find(x => x.id === id) || diagrams[0];
    document.getElementById('title').textContent = d.id + '.mermaid';
    document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.id === d.id));
    const stage = document.getElementById('stage');
    if (panZoom) { panZoom.destroy(); panZoom = null; }
    try {
      const { svg } = await mermaid.render('m' + (++seq), d.src);
      stage.innerHTML = svg;
      const el = stage.querySelector('svg');
      el.removeAttribute('width'); el.removeAttribute('height'); el.style.maxWidth = 'none';
      panZoom = svgPanZoom(el, { zoomScaleSensitivity: 0.3, minZoom: 0.2, maxZoom: 20, fit: true, center: true });
    } catch (e) {
      stage.innerHTML = '<div id="error"></div>';
      document.getElementById('error').textContent = 'Mermaid error in ' + d.id + '.mermaid\n\n' + e.message;
    }
  }

  document.getElementById('zoomIn').onclick = () => panZoom && panZoom.zoomIn();
  document.getElementById('zoomOut').onclick = () => panZoom && panZoom.zoomOut();
  document.getElementById('fit').onclick = () => panZoom && (panZoom.resize(), panZoom.fit(), panZoom.center());
  addEventListener('resize', () => panZoom && (panZoom.resize(), panZoom.fit(), panZoom.center()));
  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
