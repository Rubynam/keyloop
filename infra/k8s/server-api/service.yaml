# Replaces nginx's upstream: the Ingress in front of the cluster routes here
apiVersion: v1
kind: Service
metadata:
  name: server-api
  labels:
    app.kubernetes.io/name: server-api
spec:
  selector:
    app.kubernetes.io/name: server-api
  ports:
    - name: http
      port: 8080
      targetPort: http
