# Load balancer for server-api (Spec02).
# Docker's embedded DNS answers "server-api" with one A record per running replica.
# `resolve` re-queries it every `valid` seconds, so replicas started or stopped with
# `docker compose up --scale server-api=N` join/leave the pool without an nginx reload.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

# Keep the client's X-Request-Id, otherwise generate one
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream server_api {
    zone server_api 64k;    # shared memory: required for `resolve`
    least_conn;             # booking requests vary in duration
    server server-api:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 80;

    # LB's own liveness (compose healthcheck)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Actuator stays internal, except the health summary for smoke tests
    location /actuator/ {
        return 404;
    }
    location = /actuator/health {
        proxy_pass http://server_api;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location / {
        proxy_pass http://server_api;
        include /etc/nginx/conf.d/proxy.inc;
    }

    # Upstream failures in the same ProblemDetail shape as the API (API-08)
    error_page 502 503 504 = @upstream_error;
    location @upstream_error {
        internal;
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"No healthy server-api instance available","instance":"$request_uri"}';
    }
}
