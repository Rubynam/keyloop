worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid       /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Request id + which replica answered: lets one request be followed from LB to API (Spec02 LB-11)
    log_format upstream '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                        'rid=$req_id upstream=$upstream_addr ustatus=$upstream_status '
                        'urt=$upstream_response_time rt=$request_time';
    access_log /var/log/nginx/access.log upstream;

    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;

    include /etc/nginx/conf.d/*.conf;
}
