server:
  port: ${API_PORT:8080}
  # Behind nginx: take client IP/scheme from X-Forwarded-* (Spec02 API-13)
  forward-headers-strategy: framework
  # Finish in-flight requests on scale-down / stop (Spec02 API-15)
  shutdown: graceful

spring:
  application:
    name: server-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:scheduler}
    username: ${POSTGRES_USER:scheduler}
    password: ${POSTGRES_PASSWORD:scheduler}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema, Hibernate only checks it
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Upper bound for one command: Redis down must not stall a read (fail-open, REL-05)
      timeout: 1s
  mvc:
    problemdetails:
      enabled: true

scheduler:
  # spec-availability-ops, cache-read-path.md. Slot-list TTL stays far below the 2-day version-key TTL.
  availability:
    # Slot grid for availability AND booking (Spec07 D4). Must divide 24h; a bad value fails at boot.
    slot-step: 15m
    cache:
      enabled: true
      ttl: 30s
      ttl-padding: 30s     # random 0..30s added to ttl, so keys built together do not expire together
      lock-ttl: 2s         # rebuild lock (PX); expires by itself if its owner dies
      lock-wait: 100ms     # a waiter then computes from PostgreSQL without writing the cache
      poll-interval: 10ms
  booking:
    # Spec04 §6: (bay, technician) pairs tried, one transaction each, before 409
    max-pairs: 3
    # Candidate reads per booking when every pair of a read was taken meanwhile (guard only)
    max-candidate-reads: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
