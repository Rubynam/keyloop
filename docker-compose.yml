name: keyloop-scheduler

x-app-env: &app-env
  # Every data node; apps pick the writable one (targetServerType=primary / Lettuce
  # read-from upstream). A failover = promote step + flip PG_PRIMARY / REDIS_MASTER
  # (story 5 failover script); this list stays the same (spine AD-9)
  DB_HOSTS: postgres-1:5432,postgres-2:5432
  POSTGRES_DB: ${POSTGRES_DB:-scheduler}
  POSTGRES_USER: ${POSTGRES_USER:-scheduler}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
  REDIS_NODES: redis-1:6379,redis-2:6379
  # Log4j2 file output; ./logs on the host (see volumes below)
  LOG_PATH: /app/logs
  # JVM default zone: log timestamps and @Scheduled cron (images default to UTC)
  TZ: ${TZ:-Asia/Ho_Chi_Minh}
  # Tracing (spine AD-2, AD-8): OTLP/HTTP straight to Jaeger, one sampling ratio for both apps
  TRACING_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}

# Data tier (spine AD-1, AD-8): 2 Postgres + 2 Redis nodes, same definition each.
# Which one is primary/master comes from .env (PG_PRIMARY, REDIS_MASTER), never from the name.
# No restart: policy on purpose: an auto-restarted old primary would be writable, an
# auto-restarted empty Redis master would wipe its replica.
x-postgres: &postgres
  image: postgres:18-alpine
  entrypoint: ["/usr/local/bin/node-entrypoint.sh"]
  command:
    - postgres
    - -c
    - wal_level=replica
    - -c
    - max_connections=200
    - -c
    - hot_standby_feedback=on
    - -c
    - max_wal_senders=5
    - -c
    - max_replication_slots=5
    # A replica gone for long must not fill the primary's disk with retained WAL
    - -c
    - max_slot_wal_keep_size=1GB
  environment: &postgres-env
    POSTGRES_DB: ${POSTGRES_DB:-scheduler}
    POSTGRES_USER: ${POSTGRES_USER:-scheduler}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
    PG_PRIMARY: ${PG_PRIMARY:-postgres-1}
    PG_REPL_USER: ${PG_REPL_USER:-replicator}
    PG_REPL_PASSWORD: ${PG_REPL_PASSWORD:-replicator}
  networks: [data-net]
  healthcheck:
    test: ["CMD", "/usr/local/bin/healthcheck.sh"]
    interval: 5s
    timeout: 3s
    retries: 10
    # A replica first waits for the primary and copies it (pg_basebackup)
    start_period: 120s

x-redis: &redis
  image: redis:8-alpine
  entrypoint: ["/usr/local/bin/node-entrypoint.sh"]
  # Cache only (D1): no persistence on any node, evict least-recently-used keys
  command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
  environment: &redis-env
    REDIS_MASTER: ${REDIS_MASTER:-redis-1}
  volumes:
    - ./infra/redis/node-entrypoint.sh:/usr/local/bin/node-entrypoint.sh:ro
    - ./infra/redis/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
  networks: [data-net]
  healthcheck:
    test: ["CMD", "/usr/local/bin/healthcheck.sh"]
    interval: 5s
    timeout: 3s
    retries: 10

# Apps wait for all four nodes: depends_on cannot follow the primary chosen in .env
x-data-deps: &data-deps
  postgres-1:
    condition: service_healthy
  postgres-2:
    condition: service_healthy
  redis-1:
    condition: service_healthy
  redis-2:
    condition: service_healthy

services:
  postgres-1:
    <<: *postgres
    environment:
      <<: *postgres-env
      NODE_NAME: postgres-1
    ports:
      - "${POSTGRES_1_PORT:-${POSTGRES_PORT:-5432}}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - pg-data-1:/var/lib/postgresql
      - ./infra/postgres/node-entrypoint.sh:/usr/local/bin/node-entrypoint.sh:ro
      - ./infra/postgres/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  postgres-2:
    <<: *postgres
    environment:
      <<: *postgres-env
      NODE_NAME: postgres-2
    ports:
      - "${POSTGRES_2_PORT:-5433}:5432"
    volumes:
      - pg-data-2:/var/lib/postgresql
      - ./infra/postgres/node-entrypoint.sh:/usr/local/bin/node-entrypoint.sh:ro
      - ./infra/postgres/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  redis-1:
    <<: *redis
    environment:
      <<: *redis-env
      NODE_NAME: redis-1
    ports:
      - "${REDIS_1_PORT:-${REDIS_PORT:-6379}}:6379"

  redis-2:
    <<: *redis
    environment:
      <<: *redis-env
      NODE_NAME: redis-2
    ports:
      - "${REDIS_2_PORT:-6380}:6379"

  server-api:
    build:
      context: .
      dockerfile: server-api/Dockerfile
    image: keyloop/server-api:local
    environment:
      <<: *app-env
    volumes:
      - ./logs:/app/logs
    # No host port: replicas are reached only through nginx (Spec02 API-10).
    # Scale with: docker compose up -d --scale server-api=3 --no-recreate
    deploy:
      replicas: 2
    # Graceful shutdown in Spring (20 s) must fit inside this
    stop_grace_period: 30s
    networks:
      lb-net:
        aliases: [server-api]
      data-net: {}
      obs-net: {}
    depends_on:
      <<: *data-deps

  scheduler-batch:
    build:
      context: .
      dockerfile: scheduler-batch/Dockerfile
    image: keyloop/scheduler-batch:local
    environment:
      <<: *app-env
      HEARTBEAT_CRON: ${HEARTBEAT_CRON:-0 */5 * * * *}
    volumes:
      - ./logs:/app/logs
    ports:
      - "${BATCH_PORT:-8081}:8081"
    networks: [data-net, obs-net]
    depends_on:
      <<: *data-deps
      # The API owns the Flyway migrations; wait until they have run
      server-api:
        condition: service_healthy

  # Single entry point for the API; discovers server-api replicas via Docker DNS (Spec02)
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    # Not on data-net: the edge can never reach Postgres/Redis
    networks: [edge, lb-net]
    depends_on:
      server-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Trace store (spine AD-5). In-memory, capped at 100 000 traces by the built-in
  # all-in-one config. No healthcheck and no depends_on on it: tracing never blocks start-up.
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      # OTLP/HTTP, published for apps run from the IDE
      - "${JAEGER_OTLP_PORT:-4318}:4318"
    networks: [obs-net]

networks:
  # Only network with a published port
  edge: {}
  # nginx <-> server-api, no route to the outside
  lb-net:
    internal: true
  # apps <-> postgres-*/redis-*. Not internal in dev only because the data nodes publish
  # host ports for IDE runs (Spec01 INF-10); make it internal in production.
  data-net: {}
  # apps -> jaeger only; nginx and the databases are not on it
  obs-net: {}

volumes:
  # Cache-only Redis keeps nothing on disk, so it has no volume
  pg-data-1:
  pg-data-2:
