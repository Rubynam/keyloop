name: keyloop-scheduler

x-app-env: &app-env
  DB_HOST: postgres
  DB_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-scheduler}
  POSTGRES_USER: ${POSTGRES_USER:-scheduler}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
  REDIS_HOST: redis
  REDIS_PORT: 6379

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - pg-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Cache only (D1): no persistence needed, evict least-recently-used keys
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  scheduler-api:
    build:
      context: .
      dockerfile: scheduler-api/Dockerfile
    image: keyloop/scheduler-api:local
    environment:
      <<: *app-env
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler-batch:
    build:
      context: .
      dockerfile: scheduler-batch/Dockerfile
    image: keyloop/scheduler-batch:local
    environment:
      <<: *app-env
      HEARTBEAT_CRON: ${HEARTBEAT_CRON:-*/30 * * * * *}
    ports:
      - "${BATCH_PORTS:-8081-8082}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The API owns the Flyway migrations; wait until they have run
      scheduler-api:
        condition: service_healthy

volumes:
  pg-data:
  redis-data:
